<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1e" />
      <stop offset="35%" stop-color="#0a1942" />
      <stop offset="70%" stop-color="#12255e" />
      <stop offset="100%" stop-color="#04091a" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc" />
      <stop offset="30%" stop-color="#ffd56b" />
      <stop offset="70%" stop-color="#cf9825" />
      <stop offset="100%" stop-color="#ffe899" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe899" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050b1e" stop-opacity="0" />
    </radialGradient>
    <pattern id="celestialStars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="1.5" fill="#ffd700" opacity="0.4" />
      <circle cx="95" cy="15" r="1.2" fill="#fff" opacity="0.6" />
      <circle cx="60" cy="70" r="2" fill="#ffe899" opacity="0.5" />
      <circle cx="105" cy="85" r="1.3" fill="#ffd700" opacity="0.35" />
      <circle cx="35" cy="105" r="1.8" fill="#fff" opacity="0.45" />
      <!-- Small 4-point star -->
      <path d="M75,35 Q75,40 80,40 Q75,40 75,45 Q75,40 70,40 Q75,40 75,35 Z" fill="#ffd700" opacity="0.4" />
    </pattern>
    <filter id="nightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1000" height="1600" fill="url(#nightSky)" />
  <rect width="1000" height="1600" fill="url(#celestialStars)" />

  <!-- Ambient Light Halos -->
  <circle cx="500" cy="380" r="340" fill="url(#moonGlow)" />
  <circle cx="500" cy="820" r="420" fill="url(#moonGlow)" />

  <!-- Grand Ornate Double Borders -->
  <rect x="40" y="40" width="920" height="1520" rx="30" fill="none" stroke="url(#goldGleam)" stroke-width="3" opacity="0.9" />
  <rect x="52" y="52" width="896" height="1496" rx="22" fill="none" stroke="url(#goldGleam)" stroke-width="1.2" stroke-dasharray="8,5" opacity="0.6" />

  <!-- Corner Mihrab Flourishes -->
  <g transform="translate(52, 52)">
    <path d="M0,0 L90,0 Q60,30 30,60 L0,90 Z" fill="url(#goldGleam)" opacity="0.25" />
    <path d="M0,0 L80,0 Q40,40 0,80 Z" fill="none" stroke="url(#goldGleam)" stroke-width="2" />
    <circle cx="28" cy="28" r="6" fill="url(#goldGleam)" />
    <polygon points="50,15 54,25 64,25 56,31 59,41 50,35 41,41 44,31 36,25 46,25" fill="url(#goldGleam)" opacity="0.8" />
  </g>
  <g transform="translate(948, 52) scale(-1, 1)">
    <path d="M0,0 L90,0 Q60,30 30,60 L0,90 Z" fill="url(#goldGleam)" opacity="0.25" />
    <path d="M0,0 L80,0 Q40,40 0,80 Z" fill="none" stroke="url(#goldGleam)" stroke-width="2" />
    <circle cx="28" cy="28" r="6" fill="url(#goldGleam)" />
    <polygon points="50,15 54,25 64,25 56,31 59,41 50,35 41,41 44,31 36,25 46,25" fill="url(#goldGleam)" opacity="0.8" />
  </g>
  <g transform="translate(52, 1548) scale(1, -1)">
    <path d="M0,0 L90,0 Q60,30 30,60 L0,90 Z" fill="url(#goldGleam)" opacity="0.25" />
    <path d="M0,0 L80,0 Q40,40 0,80 Z" fill="none" stroke="url(#goldGleam)" stroke-width="2" />
    <circle cx="28" cy="28" r="6" fill="url(#goldGleam)" />
  </g>
  <g transform="translate(948, 1548) scale(-1, -1)">
    <path d="M0,0 L90,0 Q60,30 30,60 L0,90 Z" fill="url(#goldGleam)" opacity="0.25" />
    <path d="M0,0 L80,0 Q40,40 0,80 Z" fill="none" stroke="url(#goldGleam)" stroke-width="2" />
    <circle cx="28" cy="28" r="6" fill="url(#goldGleam)" />
  </g>

  <!-- Big Royal Crescent Moon (Right side upper) -->
  <g transform="translate(730, 220)">
    <path d="M50,-80 A95,95 0 1 1 -50,60 A115,115 0 1 0 50,-80 Z" fill="url(#goldGleam)" filter="url(#nightGlow)" opacity="0.9" />
    <!-- 8 Point Star near crescent -->
    <g transform="translate(-15, -45) scale(0.7)">
      <polygon points="0,-35 10,-10 35,0 10,10 0,35 -10,10 -35,0 -10,-10" fill="url(#goldGleam)" />
      <polygon points="-25,-25 0,-15 25,-25 15,0 25,25 0,15 -25,25 -15,0" fill="url(#goldGleam)" />
    </g>
  </g>

  <!-- Hanging Star Lanterns Left Side -->
  <g transform="translate(160, 95)">
    <line x1="0" y1="0" x2="0" y2="140" stroke="url(#goldGleam)" stroke-width="1.8" />
    <!-- Mosque-style multi-tier lantern -->
    <path d="M-20,140 L20,140 L12,130 L-12,130 Z" fill="url(#goldGleam)" />
    <path d="M-22,140 L-26,190 L-12,220 L12,220 L26,190 L22,140 Z" fill="#ffeaa7" fill-opacity="0.3" stroke="url(#goldGleam)" stroke-width="2" />
    <circle cx="0" cy="180" r="10" fill="#fff4ad" filter="url(#nightGlow)" />
    <path d="M-14,220 L14,220 L0,235 Z" fill="url(#goldGleam)" />
    <line x1="0" y1="235" x2="0" y2="265" stroke="url(#goldGleam)" stroke-width="1.8" />
    <circle cx="0" cy="270" r="4" fill="url(#goldGleam)" />
  </g>
  <g transform="translate(250, 95)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="url(#goldGleam)" stroke-width="1.2" opacity="0.7" />
    <polygon points="0,80 4,90 14,90 6,96 9,106 0,100 -9,106 -6,96 -14,90 -4,90" fill="url(#goldGleam)" />
  </g>

  <!-- ================= ARCH-SHAPED PHOTO FRAME (CENTERED AT 500, 380) ================= -->
  <!-- Outer Arch Border & Glow -->
  <g id="photoFrameDecoration" transform="translate(500, 380)">
    <circle cx="0" cy="0" r="195" fill="url(#moonGlow)" opacity="0.5" />
    <!-- Arch Frame Outer Trim -->
    <path d="M-160,160 L-160,-30 C-160,-130 -90,-185 0,-215 C90,-185 160,-130 160,-30 L160,160 Z" fill="none" stroke="url(#goldGleam)" stroke-width="5" filter="url(#nightGlow)" opacity="0.9" />
    <path d="M-170,170 L-170,-30 C-170,-140 -95,-195 0,-228 C95,-195 170,-140 170,-30 L170,170 Z" fill="none" stroke="url(#goldGleam)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
    <path d="M-150,150 L-150,-30 C-150,-120 -85,-175 0,-202 C85,-175 150,-120 150,-30 L150,150 Z" fill="#081438" opacity="0.6" />
  </g>

  <!-- Placeholder Arch Silhouette (shown when no photo) -->
  <g id="photoPlaceholder" transform="translate(500, 380)">
    <!-- 8 Point Star in the Arch Center -->
    <g transform="translate(0, 0) scale(1.3)">
      <polygon points="0,-55 16,-16 55,0 16,16 0,55 -16,16 -55,0 -16,-16" fill="none" stroke="url(#goldGleam)" stroke-width="2" opacity="0.8" />
      <polygon points="-38,-38 0,-22 38,-38 22,0 38,38 0,22 -38,38 -22,0" fill="none" stroke="url(#goldGleam)" stroke-width="2" opacity="0.8" />
      <circle cx="0" cy="0" r="18" fill="url(#goldGleam)" opacity="0.3" />
      <circle cx="0" cy="0" r="8" fill="url(#goldGleam)" />
    </g>
    <!-- Little crescent above star -->
    <path d="M10,-95 A22,22 0 1 1 -15,-65 A26,26 0 1 0 10,-95 Z" fill="url(#goldGleam)" />
  </g>

  <!-- Injected User Photo Slot -->
  <g id="userPhotoSlot"></g>

  <!-- ================= EID GREETING CALLIGRAPHY ================= -->
  <!-- Header Text -->
  <text id="eidTitleText" x="500" y="640" text-anchor="middle" font-family="banglaFont, 'AbuSayed', sans-serif" font-size="54" font-weight="700" fill="url(#goldGleam)" letter-spacing="3" filter="url(#nightGlow)">
    ঈদ মোবারক
  </text>

  <!-- Elegant Star Ribbon Divider -->
  <g transform="translate(500, 680)">
    <line x1="-240" y1="0" x2="-35" y2="0" stroke="url(#goldGleam)" stroke-width="1.8" />
    <line x1="35" y1="0" x2="240" y2="0" stroke="url(#goldGleam)" stroke-width="1.8" />
    <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#goldGleam)" />
    <polygon points="-8,-8 0,-18 8,-8" fill="url(#goldGleam)" opacity="0.8" />
    <polygon points="-8,8 0,18 8,8" fill="url(#goldGleam)" opacity="0.8" />
    <circle cx="-50" cy="0" r="3" fill="url(#goldGleam)" />
    <circle cx="50" cy="0" r="3" fill="url(#goldGleam)" />
  </g>

  <!-- Subtle Dome Outline at Bottom -->
  <g transform="translate(500, 1420)" opacity="0.25">
    <path d="M-300,100 L-300,40 Q-300,0 -260,0 L-260,100 Z" fill="none" stroke="url(#goldGleam)" stroke-width="1.5" />
    <path d="M-240,100 L-240,30 Q-150,-50 -60,30 L-60,100 Z" fill="none" stroke="url(#goldGleam)" stroke-width="1.5" />
    <path d="M-60,100 L-60,20 Q0,-70 60,20 L60,100 Z" fill="none" stroke="url(#goldGleam)" stroke-width="2" />
    <path d="M60,100 L60,30 Q150,-50 240,30 L240,100 Z" fill="none" stroke="url(#goldGleam)" stroke-width="1.5" />
    <path d="M260,100 L260,40 Q260,0 300,0 L300,100 Z" fill="none" stroke="url(#goldGleam)" stroke-width="1.5" />
  </g>

  <!-- Card Content injected here -->
  <g id="customCardContent"></g>

  <!-- Footer Star Motif -->
  <g transform="translate(500, 1500)">
    <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#goldGleam)" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="4" fill="url(#goldGleam)" />
    <circle cx="-50" cy="0" r="2.5" fill="url(#goldGleam)" />
    <circle cx="50" cy="0" r="2.5" fill="url(#goldGleam)" />
  </g>
</svg>

