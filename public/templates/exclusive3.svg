<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f030c" />
      <stop offset="35%" stop-color="#4a0a1f" />
      <stop offset="70%" stop-color="#6e1030" />
      <stop offset="100%" stop-color="#1a020a" />
    </linearGradient>
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2aa" />
      <stop offset="25%" stop-color="#f5cf68" />
      <stop offset="60%" stop-color="#c9911e" />
      <stop offset="100%" stop-color="#f7dd86" />
    </linearGradient>
    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#c9911e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1f030c" stop-opacity="0" />
    </radialGradient>
    <pattern id="rubyFloral" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M50 0 C60 25 75 40 100 50 C75 60 60 75 50 100 C40 75 25 60 0 50 C25 40 40 25 50 0 Z" fill="none" stroke="#f5cf68" stroke-width="0.7" opacity="0.07" />
      <circle cx="50" cy="50" r="10" fill="none" stroke="#f5cf68" stroke-width="0.6" opacity="0.08" />
    </pattern>
    <filter id="rubyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1600" fill="url(#rubyGrad)" />
  <rect width="1000" height="1600" fill="url(#rubyFloral)" />

  <circle cx="500" cy="380" r="330" fill="url(#rubyGlow)" />
  <circle cx="500" cy="800" r="380" fill="url(#rubyGlow)" />

  <!-- Outer Luxury Border -->
  <rect x="38" y="38" width="924" height="1524" rx="26" fill="none" stroke="url(#imperialGold)" stroke-width="3" opacity="0.85" />
  <rect x="50" y="50" width="900" height="1500" rx="18" fill="none" stroke="url(#imperialGold)" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.6" />

  <!-- Regal Floral Corners -->
  <g transform="translate(50, 50)">
    <path d="M0,0 L75,0 C60,20 50,30 30,50 C20,60 0,75 0,75 Z" fill="url(#imperialGold)" opacity="0.25" />
    <path d="M0,0 L65,0 C35,15 15,35 0,65 Z" fill="none" stroke="url(#imperialGold)" stroke-width="2" />
    <circle cx="22" cy="22" r="5" fill="url(#imperialGold)" />
  </g>
  <g transform="translate(950, 50) scale(-1, 1)">
    <path d="M0,0 L75,0 C60,20 50,30 30,50 C20,60 0,75 0,75 Z" fill="url(#imperialGold)" opacity="0.25" />
    <path d="M0,0 L65,0 C35,15 15,35 0,65 Z" fill="none" stroke="url(#imperialGold)" stroke-width="2" />
    <circle cx="22" cy="22" r="5" fill="url(#imperialGold)" />
  </g>
  <g transform="translate(50, 1550) scale(1, -1)">
    <path d="M0,0 L75,0 C60,20 50,30 30,50 C20,60 0,75 0,75 Z" fill="url(#imperialGold)" opacity="0.25" />
    <path d="M0,0 L65,0 C35,15 15,35 0,65 Z" fill="none" stroke="url(#imperialGold)" stroke-width="2" />
    <circle cx="22" cy="22" r="5" fill="url(#imperialGold)" />
  </g>
  <g transform="translate(950, 1550) scale(-1, -1)">
    <path d="M0,0 L75,0 C60,20 50,30 30,50 C20,60 0,75 0,75 Z" fill="url(#imperialGold)" opacity="0.25" />
    <path d="M0,0 L65,0 C35,15 15,35 0,65 Z" fill="none" stroke="url(#imperialGold)" stroke-width="2" />
    <circle cx="22" cy="22" r="5" fill="url(#imperialGold)" />
  </g>

  <!-- Crown Ornament Top -->
  <g transform="translate(500, 75)">
    <path d="M0,-25 L12,-5 L28,-5 L15,5 L20,20 L0,10 L-20,20 L-15,5 L-28,-5 L-12,-5 Z" fill="url(#imperialGold)" />
    <path d="M-150,15 Q-75,0 0,0 Q75,0 150,15" fill="none" stroke="url(#imperialGold)" stroke-width="2" />
  </g>

  <!-- Lanterns -->
  <g transform="translate(140, 90)">
    <line x1="0" y1="0" x2="0" y2="110" stroke="url(#imperialGold)" stroke-width="1.8" />
    <path d="M-18,110 L18,110 L10,100 L-10,100 Z" fill="url(#imperialGold)" />
    <path d="M-20,110 L-24,155 L-10,185 L10,185 L24,155 L20,110 Z" fill="#ffeec2" fill-opacity="0.2" stroke="url(#imperialGold)" stroke-width="2" />
    <circle cx="0" cy="148" r="8" fill="#ffd700" opacity="0.8" />
    <path d="M-10,185 L10,185 L0,200 Z" fill="url(#imperialGold)" />
    <line x1="0" y1="200" x2="0" y2="225" stroke="url(#imperialGold)" stroke-width="1.8" />
    <circle cx="0" cy="228" r="3" fill="url(#imperialGold)" />
  </g>
  <g transform="translate(860, 90)">
    <line x1="0" y1="0" x2="0" y2="110" stroke="url(#imperialGold)" stroke-width="1.8" />
    <path d="M-18,110 L18,110 L10,100 L-10,100 Z" fill="url(#imperialGold)" />
    <path d="M-20,110 L-24,155 L-10,185 L10,185 L24,155 L20,110 Z" fill="#ffeec2" fill-opacity="0.2" stroke="url(#imperialGold)" stroke-width="2" />
    <circle cx="0" cy="148" r="8" fill="#ffd700" opacity="0.8" />
    <path d="M-10,185 L10,185 L0,200 Z" fill="url(#imperialGold)" />
    <line x1="0" y1="200" x2="0" y2="225" stroke="url(#imperialGold)" stroke-width="1.8" />
    <circle cx="0" cy="228" r="3" fill="url(#imperialGold)" />
  </g>

  <!-- ================= PHOTO FRAME AREA (CENTERED AT 500, 380, R=165) ================= -->
  <!-- Octagonal / Jewel Bezel Frame -->
  <g id="photoFrameDecoration" transform="translate(500, 380)">
    <circle cx="0" cy="0" r="185" fill="url(#rubyGlow)" opacity="0.6" />
    <!-- Octagon Border -->
    <polygon points="70,-170 170,-70 170,70 70,170 -70,170 -170,70 -170,-70 -70,-170" fill="none" stroke="url(#imperialGold)" stroke-width="4" />
    <polygon points="65,-160 160,-65 160,65 65,160 -65,160 -160,65 -160,-65 -65,-160" fill="none" stroke="url(#imperialGold)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7" />
    <!-- Circular inner bezel -->
    <circle cx="0" cy="0" r="162" fill="none" stroke="url(#imperialGold)" stroke-width="4" />
    <circle cx="0" cy="0" r="156" fill="#2d0513" opacity="0.5" />
    <!-- 8 decorative gems on octagon corners -->
    <circle cx="70" cy="-170" r="4" fill="url(#imperialGold)" />
    <circle cx="170" cy="-70" r="4" fill="url(#imperialGold)" />
    <circle cx="170" cy="70" r="4" fill="url(#imperialGold)" />
    <circle cx="70" cy="170" r="4" fill="url(#imperialGold)" />
    <circle cx="-70" cy="170" r="4" fill="url(#imperialGold)" />
    <circle cx="-170" cy="70" r="4" fill="url(#imperialGold)" />
    <circle cx="-170" cy="-70" r="4" fill="url(#imperialGold)" />
    <circle cx="-70" cy="-170" r="4" fill="url(#imperialGold)" />
  </g>

  <!-- Placeholder Medallion (when no photo) -->
  <g id="photoPlaceholder" transform="translate(500, 380)">
    <circle cx="0" cy="0" r="154" fill="#260410" stroke="url(#imperialGold)" stroke-width="1.5" />
    <g transform="scale(1.3)">
      <polygon points="0,-50 15,-15 50,0 15,15 0,50 -15,15 -50,0 -15,-15" fill="none" stroke="url(#imperialGold)" stroke-width="2" opacity="0.7" />
      <polygon points="-35,-35 0,-20 35,-35 20,0 35,35 0,20 -35,35 -20,0" fill="none" stroke="url(#imperialGold)" stroke-width="2" opacity="0.7" />
    </g>
    <!-- Crescent & Star -->
    <path d="M6,-20 A26,26 0 1 1 -20,16 A32,32 0 1 0 6,-20 Z" fill="url(#imperialGold)" />
    <polygon points="5,-5 8,2 16,2 10,7 12,15 5,10 -2,15 0,7 -6,2 2,2" fill="url(#imperialGold)" />
  </g>

  <!-- User Photo Slot -->
  <g id="userPhotoSlot"></g>

  <!-- ================= EID GREETING ================= -->
  <text id="eidTitleText" x="500" y="640" text-anchor="middle" font-family="banglaFont, 'AbuSayed', sans-serif" font-size="52" font-weight="700" fill="url(#imperialGold)" letter-spacing="2">
    ঈদ মোবারক
  </text>

  <!-- Divider -->
  <g transform="translate(500, 680)">
    <line x1="-220" y1="0" x2="-35" y2="0" stroke="url(#imperialGold)" stroke-width="1.5" />
    <line x1="35" y1="0" x2="220" y2="0" stroke="url(#imperialGold)" stroke-width="1.5" />
    <polygon points="0,-10 10,0 0,10 -10,0" fill="url(#imperialGold)" />
    <circle cx="-50" cy="0" r="3" fill="url(#imperialGold)" />
    <circle cx="50" cy="0" r="3" fill="url(#imperialGold)" />
  </g>

  <!-- Injected Card Content -->
  <g id="customCardContent"></g>

  <!-- Footer -->
  <g transform="translate(500, 1495)">
    <line x1="-160" y1="0" x2="160" y2="0" stroke="url(#imperialGold)" stroke-width="1" opacity="0.6" />
    <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#imperialGold)" />
    <circle cx="-50" cy="0" r="2.5" fill="url(#imperialGold)" opacity="0.7" />
    <circle cx="50" cy="0" r="2.5" fill="url(#imperialGold)" opacity="0.7" />
  </g>
</svg>

